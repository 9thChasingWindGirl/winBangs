name: CI/CD 构建打包

on:
  workflow_dispatch:
    inputs:
      build_mode:
        description: "构建版本"
        required: true
        default: debug
        type: choice
        options:
          - debug
          - release

  push:
    branches:
      - main
      - develop


env:
  NODE_VERSION: "22"


concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true



jobs:


# ==================================================
# Stage 0
# 质量检查 + 前端构建
# ==================================================

  quality:

    name: 质量检查与前端构建

    runs-on: windows-latest


    steps:

      - name: 检出代码
        uses: actions/checkout@v4



      - name: 安装 Node.js

        uses: actions/setup-node@v4

        with:

          node-version: ${{ env.NODE_VERSION }}

          cache: npm



      - name: 安装 npm 依赖

        run:

          npm install --legacy-peer-deps



      - name: 安装 Rust 工具链

        uses: dtolnay/rust-toolchain@stable

        with:

          components: clippy



      - name: 安装 MSVC 编译工具

        uses: ilammy/msvc-dev-cmd@v1



      - name: 缓存 Cargo 依赖

        uses: actions/cache@v4

        with:

          path:

            |
              ~/.cargo/registry
              ~/.cargo/git
              src-tauri/target


          key:

            ${{ runner.os }}-cargo-${{ hashFiles('src-tauri/Cargo.lock') }}


          restore-keys:

            |
              ${{ runner.os }}-cargo-



      - name: TypeScript 类型检查

        run: |

          npx tsc --noEmit



      - name: Rust 代码质量检查

        run: |

          cd src-tauri

          cargo clippy --all-targets --all-features -- -D warnings



      - name: Rust 单元测试

        run: |

          cd src-tauri

          cargo test -- --nocapture



      - name: 构建前端

        run: |

          npm run build



      - name: 上传前端构建产物

        uses: actions/upload-artifact@v4

        with:

          name: frontend-dist

          path: dist

          retention-days: 1



      - name: 上传质量检查日志

        if: failure()

        uses: actions/upload-artifact@v4

        with:

          name: quality-logs

          path:

            |
              *.log

          retention-days: 7





# ==================================================
# Stage 1
# Release NSIS
# ==================================================

  package-release:


    name: Release 打包 NSIS


    needs:

      - quality


    if:

      github.event_name == 'workflow_dispatch' &&
      github.event.inputs.build_mode == 'release'


    runs-on:

      windows-latest



    steps:


      - name: 检出代码

        uses: actions/checkout@v4



      - name: 安装 Node.js

        uses: actions/setup-node@v4

        with:

          node-version: ${{ env.NODE_VERSION }}

          cache: npm



      - name: 安装 npm 依赖

        run:

          npm install --legacy-peer-deps



      - name: 安装 Rust 工具链

        uses: dtolnay/rust-toolchain@stable



      - name: 安装 MSVC 编译工具

        uses: ilammy/msvc-dev-cmd@v1



      - name: 缓存 Cargo 依赖

        uses: actions/cache@v4

        with:

          path:

            |
              ~/.cargo/registry
              ~/.cargo/git
              src-tauri/target


          key:

            ${{ runner.os }}-cargo-${{ hashFiles('src-tauri/Cargo.lock') }}


          restore-keys:

            |
              ${{ runner.os }}-cargo-



      - name: 下载前端构建产物

        uses: actions/download-artifact@v4

        with:

          name: frontend-dist

          path: dist



      - name: Tauri 发布构建 (NSIS)

        run:

          npx tauri build --bundles nsis



      - name: 上传安装包

        uses: actions/upload-artifact@v4

        with:

          name:

            winBangs-installer


          path:

            src-tauri/target/release/bundle/nsis/*.exe


          if-no-files-found: error

          retention-days: 7





# ==================================================
# Stage 2
# Debug Portable
# ==================================================

  package-debug:


    name:

      Debug 便携版



    needs:

      - quality



    if:

      github.event_name == 'push' ||
      (
        github.event_name == 'workflow_dispatch' &&
        github.event.inputs.build_mode == 'debug'
      )


    runs-on:

      windows-latest



    steps:


      - name: 检出代码

        uses: actions/checkout@v4



      - name: 安装 Node.js

        uses: actions/setup-node@v4

        with:

          node-version: ${{ env.NODE_VERSION }}

          cache: npm



      - name: 安装 npm 依赖

        run:

          npm install --legacy-peer-deps



      - name: 安装 Rust 工具链

        uses: dtolnay/rust-toolchain@stable



      - name: 安装 MSVC 编译工具

        uses: ilammy/msvc-dev-cmd@v1



      - name: 缓存 Cargo 依赖

        uses: actions/cache@v4

        with:

          path:

            |
              ~/.cargo/registry
              ~/.cargo/git
              src-tauri/target


          key:

            ${{ runner.os }}-cargo-${{ hashFiles('src-tauri/Cargo.lock') }}


          restore-keys:

            |
              ${{ runner.os }}-cargo-



      - name: 下载前端构建产物

        uses: actions/download-artifact@v4

        with:

          name: frontend-dist

          path: dist



      - name: Debug 构建

        shell: pwsh

        run: |

          # 临时关闭打包器，只编译完整 app（含资源），不生成安装包
          $json = Get-Content src-tauri/tauri.conf.json -Raw | ConvertFrom-Json
          $json.bundle.active = $false
          $json | ConvertTo-Json -Depth 10 | Set-Content src-tauri/tauri.conf.json
          npx tauri build --debug



      - name: 创建便携版压缩包

        shell: pwsh

        run: |

          $folder="winBangs-debug-portable"


          New-Item -ItemType Directory -Force $folder


          Copy-Item `
            src-tauri/target/debug/winBangs.exe `
            $folder/


          if(Test-Path dist)
          {
            Copy-Item `
              -Recurse `
              dist/* `
              $folder/
          }


          Compress-Archive `
            $folder/* `
            winBangs-debug-portable.zip `
            -Force



      - name: 上传 Debug 便携包

        uses: actions/upload-artifact@v4

        with:

          name:

            winBangs-debug-portable


          path:

            winBangs-debug-portable.zip


          retention-days: 7





# ==================================================
# Summary
# ==================================================

  summary:


    name:

      CI 汇总



    if:

      always()



    needs:

      - quality
      - package-release
      - package-debug



    runs-on:

      windows-latest



    steps:


      - name: 生成 CI 汇总报告

        shell: pwsh

        run: |


          $mode = "${{ github.event.inputs.build_mode }}"

          if(!$mode)
          {
            $mode="debug(push)"
          }


          "## 🎯 winBangs CI Result" >> $env:GITHUB_STEP_SUMMARY

          "" >> $env:GITHUB_STEP_SUMMARY


          "- Build Mode: **$mode**" >> $env:GITHUB_STEP_SUMMARY

          "- Quality: **${{ needs.quality.result }}**" >> $env:GITHUB_STEP_SUMMARY

          "- Release: **${{ needs.package-release.result }}**" >> $env:GITHUB_STEP_SUMMARY

          "- Debug: **${{ needs.package-debug.result }}**" >> $env:GITHUB_STEP_SUMMARY