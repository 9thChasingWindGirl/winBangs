name: CI/CD 构建打包

on:
  workflow_dispatch:
    inputs:
      build_mode:
        description: '构建模式（debug/release/both）'
        required: false
        default: 'both'
        type: choice
        options:
          - both
          - debug
          - release
  push:
    branches: [main, develop]

env:
  NODE_VERSION: "22"

# 只保留最新一次同分支/同 PR 的运行，避免积压
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ============================
  # Stage 0: 质量 + 测试（所有模式共享，仅跑一次）
  # ============================
  quality:
    name: 质量与测试
    runs-on: windows-latest
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
    steps:
      - name: Checkout 源码
        uses: actions/checkout@v4

      - name: 安装 Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"

      - name: 安装 Rust 工具链
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: 安装 C++ 编译工具链
        uses: ilammy/msvc-dev-cmd@v1

      - name: 安装 npm 依赖
        run: npm install --legacy-peer-deps

      - name: 缓存 Cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            src-tauri/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('src-tauri/Cargo.lock') }}

      - name: 🔍 TypeScript 类型检查
        run: |
          echo "=== npx tsc --noEmit ==="
          ./node_modules/.bin/tsc --noEmit 2>&1
          if ($LASTEXITCODE -ne 0) {
            echo "::error::TypeScript 类型检查失败"
            exit 1
          }

      - name: 🔎 Rust 代码质量 (cargo clippy)
        run: |
          echo "=== cargo clippy ==="
          cd src-tauri && cargo clippy --all-targets --all-features -- -D warnings 2>&1

      - name: 🧪 Rust 后端单元测试
        run: |
          echo "=== cargo test ==="
          cd src-tauri && cargo test -- --nocapture 2>&1

      - name: 🛠️ Vite 前端构建（验证）
        run: |
          echo "=== npm run build（构建前端产物验证） ==="
          npm run build 2>&1
          if ($LASTEXITCODE -ne 0) {
            echo "::error::前端构建失败"
            exit 1
          }

      - id: set-matrix
        name: 决定要跑哪些打包模式
        run: |
          $mode = "${{ github.event.inputs.build_mode }}"
          if (-not $mode) { $mode = "both" }
          if ($mode -eq "both") {
            $json = '["debug","release"]'
          } elseif ($mode -eq "debug") {
            $json = '["debug"]'
          } else {
            $json = '["release"]'
          }
          Write-Output "matrix=$json" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append

  # ============================
  # Stage 1: Release 打包（默认，生产 NSIS）
  # ============================
  package-release:
    name: Release 打包 (NSIS)
    needs: quality
    if: contains(needs.quality.outputs.matrix, 'release')
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: 安装 Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"

      - name: 安装 Rust 工具链
        uses: dtolnay/rust-toolchain@stable

      - name: 安装 C++ 编译工具链
        uses: ilammy/msvc-dev-cmd@v1

      - name: 安装 npm 依赖
        run: npm install --legacy-peer-deps

      - name: 恢复 Cargo 缓存
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            src-tauri/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('src-tauri/Cargo.lock') }}

      - name: 🔨 Release Tauri 打包 (NSIS)
        run: |
          echo "=== npx tauri build --bundles nsis ==="
          npx tauri build --bundles nsis 2>&1
          if ($LASTEXITCODE -ne 0) {
            echo "::error::Release Tauri 构建失败"
            exit 1
          }

      - name: 📋 列出 Release 产物
        run: |
          echo "=== Release Build Artifacts ==="
          Get-ChildItem -Path src-tauri/target/release/ -Include *.exe -Recurse |
            Sort-Object Length -Descending |
            Select-Object FullName, @{
              Name='SizeMB';
              Expression={[math]::Round($_.Length/1MB, 2)}
            }

      - name: ⬆️ 上传 Release 产物（仅 NSIS 安装包）
        uses: actions/upload-artifact@v4
        with:
          name: winbang-setup-release
          path: src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error

  # ============================
  # Stage 2: Debug 打包（免安装压缩包，带控制台输出方便调试）
  # ============================
  package-debug:
    name: Debug 打包 (便携版)
    needs: quality
    if: contains(needs.quality.outputs.matrix, 'debug')
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: 安装 Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"

      - name: 安装 Rust 工具链
        uses: dtolnay/rust-toolchain@stable

      - name: 安装 C++ 编译工具链
        uses: ilammy/msvc-dev-cmd@v1

      - name: 安装 npm 依赖
        run: npm install --legacy-peer-deps

      - name: 恢复 Cargo 缓存
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            src-tauri/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('src-tauri/Cargo.lock') }}

      - name: 开启 Debug 控制台输出
        run: |
          echo "WINBANGS_DEBUG=1" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: 🔨 构建前端产物
        run: npm run build

      - name: 🔨 构建 Rust Debug 后端
        run: |
          echo "=== cargo build (debug) ==="
          cd src-tauri
          cargo build 2>&1
          if ($LASTEXITCODE -ne 0) {
            echo "::error::Debug 构建失败"
            exit 1
          }

      - name: 📋 列出 Debug 产物
        run: |
          echo "=== Debug Build Artifacts ==="
          Get-ChildItem -Path src-tauri/target/debug/winBangs.exe |
            Select-Object FullName, @{
              Name='SizeMB';
              Expression={[math]::Round($_.Length/1MB, 2)}
            }

      - name: 🗜️ 打包免安装压缩包
        run: |
          # 创建解压即用目录结构
          $dist = "winBangs-debug-portable"
          New-Item -ItemType Directory -Force -Path $dist
          # 复制主程序
          Copy-Item src-tauri/target/debug/winBangs.exe -Destination "$dist/"
          # 复制前端资源（debug 构建时 cargo build 不会自动复制前端产物，需要手动 copy）
          if (Test-Path dist/) {
            Copy-Item -Recurse dist/* "$dist/" -ErrorAction SilentlyContinue
          }
          # 复制 resources 目录（如果有）
          if (Test-Path src-tauri/resources/) {
            Copy-Item -Recurse src-tauri/resources/* "$dist/" -ErrorAction SilentlyContinue
          }
          # 打包 zip
          Compress-Archive -Path "$dist/*" -DestinationPath "winBangs-debug-portable.zip" -Force
          echo "✅ 免安装压缩包已创建: winBangs-debug-portable.zip"

      - name: ⬆️ 上传 Debug 产物
        uses: actions/upload-artifact@v4
        with:
          name: winbang-debug-portable
          path: winBangs-debug-portable.zip
          if-no-files-found: error

  # ============================
  # 汇总 Job（依赖两个打包 Job，展示最终结果）
  # ============================
  summary:
    name: CI 汇总
    runs-on: windows-latest
    needs: [quality, package-release, package-debug]
    if: always()
    steps:
      - name: 写入 Summary
        run: |
          $q = "${{ needs.quality.result }}"
          $r = "${{ needs.package-release.result }}"
          $d = "${{ needs.package-debug.result }}"

          "## 🎯 CI 结果汇总" >> $env:GITHUB_STEP_SUMMARY
          "" >> $env:GITHUB_STEP_SUMMARY
          "- 代码质量与测试: **$q**" >> $env:GITHUB_STEP_SUMMARY
          "- Release 打包: **$r**" >> $env:GITHUB_STEP_SUMMARY
          "- Debug 打包（含控制台日志）: **$d**" >> $env:GITHUB_STEP_SUMMARY
          "" >> $env:GITHUB_STEP_SUMMARY
          "### 产物下载（在 Summary 页 Artifacts 区域）：" >> $env:GITHUB_STEP_SUMMARY
          "- `winbang-setup-release` — 正式用户安装版（NSIS，无黑窗）" >> $env:GITHUB_STEP_SUMMARY
          "- `winbang-setup-debug` — 调试版（含 Win32 console，Rust panic/日志直出到黑窗，便于定位问题）" >> $env:GITHUB_STEP_SUMMARY

  # ============================
  # 失败日志 Job
  # ============================
  failure-log:
    name: 失败日志汇总
    runs-on: windows-latest
    needs: [quality, package-release, package-debug]
    if: failure()
    steps:
      - uses: actions/checkout@v4

      - name: 输出失败信息
        run: |
          echo "## ❌ CI 构建失败"
          echo ""
          echo "### 失败的 Job:"
          echo "- quality: ${{ needs.quality.result }}"
          echo "- package-release: ${{ needs.package-release.result }}"
          echo "- package-debug: ${{ needs.package-debug.result }}"
          echo ""
          echo "### 提交信息:"
          echo "- 提交: ${{ github.sha }}"
          echo "- 分支: ${{ github.ref }}"
          echo "- 触发者: ${{ github.triggering_actor }}"
          echo ""
          echo "请查看上方对应 Job 的各阶段详细日志定位问题。"

      - name: 收集环境信息
        run: |
          echo "=== Node 版本 ==="
          node --version
          npm --version
          echo ""
          echo "=== Rust 版本 ==="
          rustc --version
          cargo --version
          echo ""
          echo "=== 磁盘空间 ==="
          Get-PSDrive C | Select-Object Used, Free
