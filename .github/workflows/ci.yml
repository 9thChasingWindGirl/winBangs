name: CI/CD 构建打包

on:
  workflow_dispatch:
    inputs:
      build_mode:
        description: "构建版本"
        required: true
        default: debug
        type: choice
        options:
          - debug
          - release

  push:
    branches:
      - main
      - develop


env:
  NODE_VERSION: "22"


concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true



jobs:


# ==================================================
# Stage 0
# 质量检查 + 前端构建
# ==================================================

  quality:

    name: 质量检查与前端构建

    runs-on: windows-latest


    steps:

      - name: Checkout
        uses: actions/checkout@v4



      - name: Setup Node.js

        uses: actions/setup-node@v4

        with:

          node-version: ${{ env.NODE_VERSION }}

          cache: npm



      - name: Install npm dependencies

        run:

          npm install --legacy-peer-deps



      - name: Setup Rust

        uses: dtolnay/rust-toolchain@stable

        with:

          components: clippy



      - name: Setup MSVC

        uses: ilammy/msvc-dev-cmd@v1



      - name: Cache Cargo

        uses: actions/cache@v4

        with:

          path:

            |
              ~/.cargo/registry
              ~/.cargo/git
              src-tauri/target


          key:

            ${{ runner.os }}-cargo-${{ hashFiles('src-tauri/Cargo.lock') }}


          restore-keys:

            |
              ${{ runner.os }}-cargo-



      - name: TypeScript Check

        run: |

          npx tsc --noEmit



      - name: Rust Clippy

        run: |

          cd src-tauri

          cargo clippy --all-targets --all-features -- -D warnings



      - name: Rust Unit Test

        run: |

          cd src-tauri

          cargo test -- --nocapture



      - name: Build Frontend

        run: |

          npm run build



      - name: Upload dist

        uses: actions/upload-artifact@v4

        with:

          name: frontend-dist

          path: dist

          retention-days: 1



      - name: Upload quality logs

        if: failure()

        uses: actions/upload-artifact@v4

        with:

          name: quality-logs

          path:

            |
              *.log

          retention-days: 7





# ==================================================
# Stage 1
# Release NSIS
# ==================================================

  package-release:


    name: Release 打包 NSIS


    needs:

      - quality


    if:

      github.event_name == 'workflow_dispatch' &&
      github.event.inputs.build_mode == 'release'


    runs-on:

      windows-latest



    steps:


      - name: Checkout

        uses: actions/checkout@v4



      - name: Setup Node

        uses: actions/setup-node@v4

        with:

          node-version: ${{ env.NODE_VERSION }}

          cache: npm



      - name: Install npm dependencies

        run:

          npm install --legacy-peer-deps



      - name: Setup Rust

        uses: dtolnay/rust-toolchain@stable



      - name: Setup MSVC

        uses: ilammy/msvc-dev-cmd@v1



      - name: Cache Cargo

        uses: actions/cache@v4

        with:

          path:

            |
              ~/.cargo/registry
              ~/.cargo/git
              src-tauri/target


          key:

            ${{ runner.os }}-cargo-${{ hashFiles('src-tauri/Cargo.lock') }}


          restore-keys:

            |
              ${{ runner.os }}-cargo-



      - name: Download frontend dist

        uses: actions/download-artifact@v4

        with:

          name: frontend-dist

          path: dist



      - name: Tauri Release Build

        run:

          npx tauri build --bundles nsis



      - name: Upload Installer

        uses: actions/upload-artifact@v4

        with:

          name:

            winBangs-installer


          path:

            src-tauri/target/release/bundle/nsis/*.exe


          if-no-files-found: error

          retention-days: 7





# ==================================================
# Stage 2
# Debug Portable
# ==================================================

  package-debug:


    name:

      Debug 便携版



    needs:

      - quality



    if:

      github.event_name == 'push' ||
      (
        github.event_name == 'workflow_dispatch' &&
        github.event.inputs.build_mode == 'debug'
      )


    runs-on:

      windows-latest



    steps:


      - name: Checkout

        uses: actions/checkout@v4



      - name: Setup Node

        uses: actions/setup-node@v4

        with:

          node-version: ${{ env.NODE_VERSION }}

          cache: npm



      - name: Install npm dependencies

        run:

          npm install --legacy-peer-deps



      - name: Setup Rust

        uses: dtolnay/rust-toolchain@stable



      - name: Setup MSVC

        uses: ilammy/msvc-dev-cmd@v1



      - name: Cache Cargo

        uses: actions/cache@v4

        with:

          path:

            |
              ~/.cargo/registry
              ~/.cargo/git
              src-tauri/target


          key:

            ${{ runner.os }}-cargo-${{ hashFiles('src-tauri/Cargo.lock') }}


          restore-keys:

            |
              ${{ runner.os }}-cargo-



      - name: Download frontend dist

        uses: actions/download-artifact@v4

        with:

          name: frontend-dist

          path: dist



      - name: Debug Build

        run:

          npx tauri build --debug --bundles none



      - name: Create Portable Package

        shell: pwsh

        run: |

          $folder="winBangs-debug-portable"


          New-Item -ItemType Directory -Force $folder


          Copy-Item `
            src-tauri/target/debug/winBangs.exe `
            $folder/


          if(Test-Path dist)
          {
            Copy-Item `
              -Recurse `
              dist/* `
              $folder/
          }


          Compress-Archive `
            $folder/* `
            winBangs-debug-portable.zip `
            -Force



      - name: Upload Debug Package

        uses: actions/upload-artifact@v4

        with:

          name:

            winBangs-debug-portable


          path:

            winBangs-debug-portable.zip


          retention-days: 7





# ==================================================
# Summary
# ==================================================

  summary:


    name:

      CI 汇总



    if:

      always()



    needs:

      - quality
      - package-release
      - package-debug



    runs-on:

      windows-latest



    steps:


      - name: Generate Summary

        shell: pwsh

        run: |


          $mode = "${{ github.event.inputs.build_mode }}"

          if(!$mode)
          {
            $mode="debug(push)"
          }


          "## 🎯 winBangs CI Result" >> $env:GITHUB_STEP_SUMMARY

          "" >> $env:GITHUB_STEP_SUMMARY


          "- Build Mode: **$mode**" >> $env:GITHUB_STEP_SUMMARY

          "- Quality: **${{ needs.quality.result }}**" >> $env:GITHUB_STEP_SUMMARY

          "- Release: **${{ needs.package-release.result }}**" >> $env:GITHUB_STEP_SUMMARY

          "- Debug: **${{ needs.package-debug.result }}**" >> $env:GITHUB_STEP_SUMMARY